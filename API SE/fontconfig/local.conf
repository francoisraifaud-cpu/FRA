<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Astro - alias polices pour Gotenberg (tous workflows THEME/PREV/SYN, tous rapports).
  Monte dans le conteneur via docker-compose : ./fontconfig/local.conf -> /etc/fonts/local.conf

  Les CSS des rapports demandent des familles symboles Windows/Mac/Google absentes du
  conteneur Linux (Segoe UI Symbol, Apple Symbols, Symbola, Arial Unicode MS, et
  "Noto Sans Symbols 2" avec un espace = nom Google Fonts, alors que le paquet Debian
  s'appelle "Noto Sans Symbols2" sans espace).

  Chromium resout la police glyphe par glyphe. Sans cet alias, les signes du zodiaque
  (U+2648-2653) tombent sur "Noto Sans Symbols2" / Noto qui les rend en PRESENTATION
  EMOJI coloree (pastilles), laide sur une carte du ciel. On prepend donc
  "Noto Sans Symbols" (glyphes astro en trait fin) AVANT "Noto Sans Symbols2".
-->
<fontconfig>
  <match target="pattern">
    <test name="family"><string>Noto Sans Symbols 2</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI Symbol</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Apple Symbols</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Symbola</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial Unicode MS</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
</fontconfig>
