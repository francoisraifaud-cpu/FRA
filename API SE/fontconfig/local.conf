<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Astro - alias polices pour Gotenberg (tous workflows THEME/PREV/SYN, tous rapports).
  Les CSS demandent des familles symboles Windows/Mac/Google absentes du conteneur Linux
  (Segoe UI Symbol, Apple Symbols, Symbola, Arial Unicode MS, Noto Sans Symbols 2 avec espace).
  Chromium resout glyphe par glyphe : on prepend les vraies polices symboles installees
  (Noto Sans Symbols + Symbols2) pour que les pictogrammes zodiaque/planetes soient nets,
  au lieu de retomber sur Noto Sans (rendu moche).
-->
<fontconfig>
  <!-- IMPORTANT : Noto Sans Symbols (trait fin) AVANT Symbols2 (qui rend les signes
       zodiaque U+2648-2653 en presentation EMOJI coloree, indesirable sur une carte). -->
  <match target="pattern">
    <test name="family"><string>Noto Sans Symbols 2</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Segoe UI Symbol</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Apple Symbols</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Symbola</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial Unicode MS</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
</fontconfig>
