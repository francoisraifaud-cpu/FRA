server {
    listen 443 ssl http2;
    server_name api.spikka.eu;

    ssl_certificate     /etc/letsencrypt/live/api.spikka.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.spikka.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location /pdf/ {
        if ($astro_key_ok = 0) { return 401; }
        limit_req zone=astro_tls burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        if ($astro_key_ok = 0) { return 401; }
        limit_req zone=astro_tls burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
