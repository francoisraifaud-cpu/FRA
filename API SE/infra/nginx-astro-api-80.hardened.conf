# Port 80 DURCI — remédiation audit cyber F1 (2026-07-18)
# Remplace le proxy clair `location / -> :8000` par une redirection 301 vers HTTPS.
# But : supprimer l'exposition de l'API astro en clair et sans clé sur le port 80.
#
# Sûr avec certbot plugin nginx (authenticator = nginx) : le renouvellement Let's Encrypt
# ne dépend PAS d'un webroot ACME sur :80 ; le plugin gère le challenge transitoirement.
#
# Déployer vers : /etc/nginx/sites-available/astro-api-proxy
#   scp "FRA/API SE/infra/nginx-astro-api-80.hardened.conf" root@46.225.174.155:/etc/nginx/sites-available/astro-api-proxy
#   ssh root@46.225.174.155 "nginx -t && systemctl reload nginx && certbot renew --dry-run"
#
# Voir : FRA/ARCHI/AUDIT-CYBERSECURITE-2026-07-18.md (F1).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health en clair toléré (smoke/uptime sans secret) ; tout le reste part en HTTPS.
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    location / {
        return 301 https://api.spikka.eu$request_uri;
    }
}
