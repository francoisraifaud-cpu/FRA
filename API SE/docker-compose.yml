# Source de verite (depot) - Gotenberg pour astro-server.
# Deploiement : copier ce fichier vers /opt/astro/docker-compose.yml sur la VM, puis :
#   cd /opt/astro && docker compose pull && docker compose up -d
#
# Port public attendu : 3000.
# Polices : fontconfig/local.conf monte dans /etc/fonts/local.conf alias les familles
# symboles (Segoe UI Symbol, Apple Symbols, Symbola, Arial Unicode MS, Noto Sans Symbols 2)
# vers Noto Sans Symbols/Symbols2 pour des pictogrammes astro nets dans tous les rapports.

services:
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: "1536m"
    volumes:
      - ./fontconfig/local.conf:/etc/fonts/local.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "4"
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=false"
      - "--chromium-allow-list=.*"

