# Source de vérité (dépôt) — Gotenberg pour astro-server.
# Déploiement : copier ce fichier vers /opt/astro/docker-compose.yml sur la VM, puis :
#   cd /opt/astro && docker compose pull && docker compose up -d
#
# Port public attendu : 3000 (voir UFW + INVENTAIRE-SERVEUR-ASTRO-SWISSEPH-GOTENBERG.md).
# Limites mémoire + rotation logs (Compose file format / plugin v2).
#
# Polices (2026-06-14) : ./fontconfig/local.conf est monté dans /etc/fonts/local.conf.
# Il alias les familles symboles demandées par les CSS (Segoe UI Symbol, Apple Symbols,
# Symbola, Arial Unicode MS, "Noto Sans Symbols 2") vers "Noto Sans Symbols" (trait fin)
# AVANT "Noto Sans Symbols2" : sinon les signes du zodiaque (U+2648-2653) sont rendus en
# présentation EMOJI colorée (laide) au lieu des glyphes astrologiques monochromes.
# S'applique à TOUS les rapports (données/technique/récit) et workflows (THEME/PREV/SYN).

services:
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    ports:
      - "3000:3000"
    mem_limit: "1536m"
    volumes:
      - ./fontconfig/local.conf:/etc/fonts/local.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "4"
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=false"
      - "--chromium-allow-list=.*"
